version: "3.8"
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./:/app # Synchronisiert deinen Code
      - /app/node_modules # Wichtig: Verhindert, dass node_modules überschrieben wird
    environment:
      - CHOKIDAR_USEPOLLING=true # Aktiviert File Watching
      - WATCHPACK_POLLING=true # Für neuere React-Versionen

